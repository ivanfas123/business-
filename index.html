<!doctype html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Resale</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{--bg:#0e0c19;--s1:#181530;--s2:#221e40;--tx:#f2effd;--hi:#8e89b0;--ln:rgba(255,255,255,.07);--g:linear-gradient(135deg,#7c5cff,#e24fb2);--pos:#3dd6a0;--neg:#ff6b86;--wr:#ffc247}
[data-t=light]{--bg:#f3f1fb;--s1:#fff;--s2:#ebe7fa;--tx:#1b1733;--hi:#7a7596;--ln:rgba(30,20,80,.08);--pos:#0fa57a;--neg:#e0405f;--wr:#c98a00}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:500 15px/1.35 Manrope,system-ui,sans-serif;padding:0 14px 120px;transition:background .3s}
h1{margin:2px 0 0;font-size:26px;font-weight:800;letter-spacing:-.5px}h3{margin:0 0 6px;font-size:20px;font-weight:800}h4{margin:0 0 6px;font-size:15px;font-weight:700}
small,.mut{color:var(--hi);font-size:12.5px}.pos{color:var(--pos)}.neg{color:var(--neg)}.wr{color:var(--wr)}
.top{padding:calc(14px + env(safe-area-inset-top)) 2px 6px}
.seg{display:flex;gap:2px;background:var(--s1);border-radius:14px;padding:3px;margin:12px 0;overflow-x:auto;scrollbar-width:none}
.seg div{flex:1;text-align:center;padding:8px 10px;border-radius:11px;font-size:13px;font-weight:600;color:var(--hi);white-space:nowrap;transition:.2s}
.seg div.on{background:var(--g);color:#fff;box-shadow:0 4px 14px rgba(124,92,255,.4)}
.hero{position:relative;overflow:hidden;border-radius:26px;padding:22px 20px 18px;color:#fff;background:linear-gradient(135deg,#5b3df5,#b43fc4 60%,#ee5a9c);box-shadow:0 14px 36px rgba(124,92,255,.35)}
.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;background:rgba(255,255,255,.12)}
.hero:before{width:180px;height:180px;right:-50px;top:-70px}.hero:after{width:110px;height:110px;right:50px;bottom:-60px}
.hero small{color:rgba(255,255,255,.8)}.hero b.big{display:block;font-size:42px;font-weight:800;letter-spacing:-1.5px;margin:4px 0 14px;font-variant-numeric:tabular-nums}
.hm{display:flex;gap:8px;position:relative;z-index:1}.hm div{flex:1;background:rgba(255,255,255,.16);border-radius:14px;padding:8px 10px;backdrop-filter:blur(6px)}.hm b{display:block;font-size:14px;font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.k{background:var(--s1);border:1px solid var(--ln);border-radius:20px;padding:13px}.k i{display:grid;place-items:center;width:34px;height:34px;border-radius:12px;background:var(--s2);font-style:normal;margin-bottom:8px}
.k b{display:block;font-size:18px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:1px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:22px;padding:14px;margin:12px 0}
.li{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--ln)}.li:last-child{border:0;padding-bottom:0}.li:first-of-type{padding-top:2px}
.av{flex:none;width:44px;height:44px;border-radius:15px;background:var(--s2);display:grid;place-items:center;font-size:22px}
.mid{flex:1;min-width:0}.mid b,.end b{display:block;font-weight:700}.mid b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.end{text-align:right;flex:none}
.chip{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--s2);margin-left:6px;vertical-align:1px}
.chip.neg{background:rgba(255,107,134,.15)}.chip.wr{background:rgba(255,194,71,.15)}.chip.pos{background:rgba(61,214,160,.15)}
.acts{display:flex;gap:8px;margin:10px 0 2px 56px}
.btn{padding:12px 16px;border-radius:14px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:700 14px Manrope,sans-serif;flex:1;transition:transform .1s}.btn:active{transform:scale(.96)}
.btn.pri{background:var(--g);border:0;color:#fff;box-shadow:0 6px 16px rgba(124,92,255,.3)}.btn.bad{color:var(--neg)}.btn.sm{padding:8px 12px;font-size:13px;border-radius:11px}
.rw{display:flex;gap:8px;margin-top:16px}
.search{display:flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:0 14px;margin:12px 0 0}.search input{margin:0;border:0;background:none;padding:13px 0}
.cats{display:flex;gap:6px;overflow-x:auto;margin:10px -14px;padding:0 14px;scrollbar-width:none}
.cats div{flex:none;padding:7px 13px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);font-size:13px;font-weight:600;color:var(--hi)}.cats div.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--ln);background:var(--s2);color:var(--tx);font:600 16px Manrope,sans-serif;margin-top:5px;outline:0}input:focus,select:focus,textarea:focus{border-color:#7c5cff}
label{display:block;margin:12px 0 0;font-size:12.5px;color:var(--hi);font-weight:600}
.empty{text-align:center;padding:34px 10px;color:var(--hi)}.empty i{display:block;font-size:44px;font-style:normal;margin-bottom:8px}
nav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));display:flex;background:var(--s1);border:1px solid var(--ln);border-radius:24px;padding:6px;box-shadow:0 10px 30px rgba(0,0,0,.35);z-index:5}
nav a{flex:1;text-align:center;font-size:10.5px;font-weight:700;color:var(--hi);padding:4px 0;transition:.2s}nav a i{display:block;font-style:normal;font-size:19px;width:38px;height:30px;line-height:30px;margin:0 auto 1px;border-radius:12px;transition:.2s}
nav a.on{color:var(--tx)}nav a.on i{background:var(--g);box-shadow:0 4px 12px rgba(124,92,255,.45)}
.fab{position:fixed;right:18px;bottom:calc(88px + env(safe-area-inset-bottom));width:56px;height:56px;border-radius:20px;border:0;background:var(--g);color:#fff;font-size:30px;font-weight:300;box-shadow:0 10px 24px rgba(226,79,178,.45);z-index:4;transition:transform .15s}.fab:active{transform:scale(.9) rotate(90deg)}
#sheet{display:none;position:fixed;inset:0;z-index:9}#sheet.on{display:block}
.bk{position:absolute;inset:0;background:rgba(5,3,15,.6);backdrop-filter:blur(3px);animation:f .2s}
.sh{position:absolute;left:0;right:0;bottom:0;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom));max-height:90%;overflow:auto;animation:u .28s cubic-bezier(.2,.9,.3,1)}
.hd{width:40px;height:5px;border-radius:9px;background:var(--ln);margin:0 auto 14px;background:var(--hi);opacity:.4}
@keyframes u{from{transform:translateY(100%)}}@keyframes f{from{opacity:0}}
.bars{display:flex;align-items:flex-end;gap:4px;height:100px;margin-top:10px}.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px}
.bars i{width:100%;border-radius:6px;background:var(--g);min-height:3px}.bars i.n{background:var(--neg)}.bars small{font-size:9.5px}
.pg{height:7px;border-radius:9px;background:var(--s2);overflow:hidden;margin:8px 0 4px}.pg i{display:block;height:100%;background:var(--g);border-radius:9px}
#toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translate(-50%,-90px);background:var(--tx);color:var(--bg);padding:11px 18px;border-radius:99px;font-weight:700;font-size:14px;z-index:20;transition:.3s;white-space:nowrap}#toast.on{transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.sh:before{content:"";position:absolute;left:0;right:0;top:0;height:130px;background:linear-gradient(180deg,rgba(124,92,255,.25),transparent);pointer-events:none;border-radius:28px 28px 0 0}
.sh>*{position:relative}.sh label{margin-top:14px}
.ico{width:54px;height:54px;border-radius:19px;background:var(--g);display:grid;place-items:center;font-size:27px;margin-bottom:10px;box-shadow:0 8px 22px rgba(124,92,255,.45)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.tl{padding:11px 4px;border-radius:16px;background:var(--s2);border:2px solid transparent;text-align:center;font-size:12.5px;font-weight:700;color:var(--tx);transition:.15s}.tl i{display:block;font-style:normal;font-size:24px;margin-bottom:2px}.tl.on{border-color:#7c5cff;background:rgba(124,92,255,.2);transform:scale(1.03)}
.money{position:relative}.money input{font-size:24px;font-weight:800;padding:15px 50px 15px 16px}.money span{position:absolute;right:16px;top:50%;transform:translateY(-35%);font-weight:800;color:var(--hi)}
.qk{display:flex;gap:6px;margin-top:8px}.qk div{flex:1;text-align:center;padding:10px 0;border-radius:12px;background:var(--s2);font-weight:800;font-size:13px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style></head><body>
<div id="app"></div><button class="fab" id="fab" onclick="fabAct()">+</button>
<nav id="nav"></nav><div id="sheet"></div><div id="toast"></div>
<script>
['gesturestart','gesturechange','gestureend'].forEach(e=>document.addEventListener(e,x=>x.preventDefault()));document.addEventListener('touchmove',x=>{if(x.touches.length>1)x.preventDefault()},{passive:false});let _lt=0;document.addEventListener('touchend',x=>{const n=Date.now();if(n-_lt<300)x.preventDefault();_lt=n},{passive:false});
const tg=window.Telegram?.WebApp;tg?.ready();tg?.expand();
try{tg?.setHeaderColor?.('bg_color')}catch(e){}
document.documentElement.dataset.t=tg?.colorScheme||(matchMedia('(prefers-color-scheme: light)').matches?'light':'dark');
const K='resale_v1';let db;try{db=JSON.parse(localStorage.getItem(K))}catch(e){}
db=db||{items:[],sales:[],exp:[],set:{cur:'₽',low:2}};
const save=()=>{try{localStorage.setItem(K,JSON.stringify(db))}catch(e){}};
const $=s=>document.querySelector(s),uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,5);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>(Math.round((+n||0)*100)/100).toLocaleString('ru-RU')+' '+db.set.cur;
const sum=(a,f)=>a.reduce((s,x)=>s+(+f(x)||0),0),hap=t=>{try{tg?.HapticFeedback?.impactOccurred(t||'light')}catch(e){}};
const IC={Под:'🔋',Одноразка:'💨',Жидкость:'🧪',Испаритель:'🔥',Сигареты:'🚬',Одноразки:'💨',Поды:'🔋',Жидкости:'🧪',Картриджи:'🧩',Испарители:'🔥',Аксессуары:'🎒',Другое:'📦',Доставка:'🚚',Реклама:'📣',Аренда:'🏠',Упаковка:'🎁',Комиссия:'💳','Возврат/брак':'↩️'};
const CATS=['Под','Одноразка','Жидкость','Испаритель','Сигареты'];
const ECATS=['Доставка','Реклама','Аренда','Упаковка','Комиссия','Возврат/брак','Другое'];
const PAY=['Наличные','Карта/перевод','В долг'];
let tab='home',per='month',q='',fcat='';
const TABS=[['home','📊','Главная'],['stock','📦','Склад'],['sales','💰','Продажи'],['exp','🧾','Расходы'],['part','🤝','Партнёр'],['more','💸','Долги']];
const inP=d=>{const t=new Date(d),n=new Date();if(per=='all')return true;if(per=='day')return t.toDateString()==n.toDateString();
 if(per=='week')return n-t<7*864e5;if(per=='month')return t.getMonth()==n.getMonth()&&t.getFullYear()==n.getFullYear();return t.getFullYear()==n.getFullYear()};
const PN={day:'Сегодня',week:'7 дней',month:'Месяц',year:'Год',all:'Всё'};
function stats(){const S=db.sales.filter(s=>inP(s.date)),E=db.exp.filter(e=>inP(e.date));
 const rev=sum(S,s=>s.price*s.qty),cogs=sum(S,s=>s.buy*s.qty),gross=rev-cogs,ex=sum(E,e=>e.sum);
 return{S,E,rev,cogs,gross,ex,net:gross-ex,cnt:sum(S,s=>s.qty),mar:rev?gross/rev*100:0,roi:cogs?gross/cogs*100:0}}
const debts=()=>db.sales.filter(s=>s.pay=='В долг'&&!s.paid),stockVal=()=>sum(db.items,i=>i.buy*i.qty),stockPot=()=>sum(db.items,i=>i.sell*i.qty);
const seg=()=>`<div class="seg">${Object.keys(PN).map(k=>`<div class="${per==k?'on':''}" onclick="per='${k}';hap();go()">${PN[k]}</div>`).join('')}</div>`;
const li=(ic,t,s,a,b,oc)=>`<div class="li" ${oc?`onclick="${oc}"`:''}><div class="av">${ic}</div><div class="mid"><b>${t}</b><small>${s}</small></div><div class="end"><b>${a}</b>${b||''}</div></div>`;
const empty=(i,t)=>`<div class="empty"><i>${i}</i>${t}</div>`;
const head=(t,s)=>`<div class="top"><small>${s}</small><h1>${t}</h1></div>`;
const hello=()=>{const h=new Date().getHours();return h<6?'Доброй ночи':h<12?'Доброе утро':h<18?'Добрый день':'Добрый вечер'};
function home(){const s=stats();
 const wd=['вс','пн','вт','ср','чт','пт','сб'];
 const days=[...Array(14)].map((_,i)=>{const t=new Date(Date.now()-(13-i)*864e5),d=t.toDateString();
  return[wd[t.getDay()],sum(db.sales.filter(x=>new Date(x.date).toDateString()==d),x=>(x.price-x.buy)*x.qty)-sum(db.exp.filter(x=>new Date(x.date).toDateString()==d),x=>x.sum)]});
 const mx=Math.max(1,...days.map(d=>Math.abs(d[1])));
 const top={};s.S.forEach(x=>{top[x.name]=top[x.name]||{p:0,n:0,c:x.cat};top[x.name].p+=(x.price-x.buy)*x.qty;top[x.name].n+=x.qty});
 const tl=Object.entries(top).sort((a,b)=>b[1].p-a[1].p).slice(0,5);
 const low=db.items.filter(i=>i.qty<=db.set.low),dl=debts(),pot=stockPot(),inv=stockVal(),exs=s.S.filter(x=>x.ex);
 return head(hello()+' 👋','Сводка бизнеса')+seg()+`<div class="hero"><small>Чистая прибыль · ${PN[per]}</small><b class="big" data-n="${s.net}">${fmt(s.net)}</b>
 <div class="hm"><div><small>Выручка</small><b>${fmt(s.rev)}</b></div><div><small>Расходы</small><b>${fmt(s.ex)}</b></div><div><small>Маржа</small><b>${s.mar.toFixed(0)}%</b></div></div></div>
 <div class="grid"><div class="k"><i>💎</i><small>Валовая прибыль</small><b class="${s.gross>=0?'pos':'neg'}">${fmt(s.gross)}</b></div><div class="k"><i>📈</i><small>ROI</small><b>${s.roi.toFixed(0)}%</b></div>
 <div class="k"><i>🛍</i><small>Продано, шт.</small><b>${s.cnt}</b></div><div class="k"><i>🧾</i><small>Средний чек</small><b>${fmt(s.S.length?s.rev/s.S.length:0)}</b></div></div>
 ${exs.length?`<div class="card"><h4>🔄 Обмены · ${PN[per]}</h4><div style="display:flex;justify-content:space-between"><b>${exs.length} шт.</b><b class="pos">+${fmt(sum(exs,x=>(x.price-x.buy)*x.qty))}</b></div><small>Доплаты клиентов: ${fmt(sum(exs,x=>x.ex.extra))}</small></div>`:''}<div class="card"><h4>Склад</h4><div style="display:flex;justify-content:space-between"><b>${fmt(inv)}</b><small>потенциал ${fmt(pot)}</small></div><div class="pg"><i style="width:${pot?inv/pot*100:0}%"></i></div><small>Вложено ${pot?(inv/pot*100).toFixed(0):0}% от возможной выручки</small></div>
 <div class="card"><h4>Прибыль за 14 дней</h4><div class="bars">${days.map(d=>`<div><i class="${d[1]<0?'n':''}" style="height:${Math.abs(d[1])/mx*78}%"></i><small>${d[0]}</small></div>`).join('')}</div></div>
 ${tl.length?`<div class="card"><h4>Лучшие товары</h4>${tl.map(([n,v],i)=>li(['🥇','🥈','🥉','④','⑤'][i],esc(n),v.n+' шт.',fmt(v.p),'',0)).join('')}</div>`:''}
 ${(()=>{const d=debtSum();return d.me||d.i?`<div class="card" onclick="tab='more';go();scrollTo(0,0)"><h4>🤝 Долги</h4><div style="display:flex;justify-content:space-between"><div><small>Мне должны</small><b class="pos" style="display:block">${fmt(d.me)}</b></div><div class="end"><small>Я должен</small><b class="neg">${fmt(d.i)}</b></div></div></div>`:''})()}
 ${homeExtra(s)}<div class="rw"><button class="btn pri" onclick="tradeStart()">🔄 Обмен</button><button class="btn" onclick="calc()">🧮 Калькулятор</button><button class="btn" onclick="report()">📨 Отчёт</button></div>`}
function stock(){const a=db.items.filter(i=>(!fcat||i.cat==fcat)&&(i.name+i.sup).toLowerCase().includes(q.toLowerCase()));
 return head('Склад',`${a.length} позиций · ${sum(a,i=>i.qty)} шт. · ${fmt(sum(a,i=>i.buy*i.qty))}`)+`<div class="search">🔍<input placeholder="Название или поставщик" value="${esc(q)}" oninput="q=this.value;go(1)"></div>
 <div class="cats"><div class="${fcat?'':'on'}" onclick="fcat='';go()">Все</div>${CATS.map(c=>`<div class="${fcat==c?'on':''}" onclick="fcat='${c}';go()">${IC[c]} ${c}</div>`).join('')}</div>
 ${a.map(i=>{const m=i.sell?(i.sell-i.buy)/i.sell*100:0;return`<div class="card" style="margin:8px 0">${li(IC[i.cat]||'📦',esc(i.name)+(i.qty<=db.set.low?`<span class="chip ${i.qty?'wr':'neg'}">${i.qty?'мало':'нет'}</span>`:''),`${fmt(i.buy)} → ${fmt(i.sell)}${i.sup?' · '+esc(i.sup):''}`,i.qty+' шт.',`<small class="${m>=0?'pos':'neg'}">маржа ${m.toFixed(0)}%</small>`,`itemView('${i.id}')`)}
 <div class="acts"><button class="btn sm pri" onclick="sellForm('${i.id}')">Продать</button><button class="btn sm" onclick="restock('${i.id}')">Пополнить</button><button class="btn sm" onclick="tradeForm('${i.id}')">Обмен</button></div></div>`}).join('')||empty('📦','Склад пуст.<br>Нажмите + и добавьте первый товар')}`}
function sales(){const a=db.sales.filter(s=>inP(s.date)).sort((x,y)=>y.date-x.date),p=sum(a,s=>(s.price-s.buy)*s.qty);
 return head('Продажи',`${a.length} продаж · прибыль ${fmt(p)}`)+seg()+`<div class="rw" style="margin:0 0 10px"><button class="btn pri" onclick="tradeStart()">🔄 Новый обмен</button></div><div class="card">${a.map(s=>{const p=(s.price-s.buy)*s.qty;
 return li(IC[s.cat]||'📦',esc(s.name)+` ×${s.qty}`+(s.pay=='В долг'&&!s.paid?'<span class="chip neg">долг</span>':'')+(s.pay=='Обмен'?'<span class="chip pos">обмен</span>':'')+(s.ex?'<span class="chip pos">обмен</span>':''),`${new Date(s.date).toLocaleDateString('ru-RU')} · ${esc(s.client||'—')} · ${s.pay}${s.ex?' · получено: '+esc(s.ex.name)+' ×'+s.ex.qty:''}`,fmt(s.price*s.qty),`<small class="${p>=0?'pos':'neg'}">${p>=0?'+':''}${fmt(p)}</small>`,`saleMenu('${s.id}')`)}).join('')||empty('💰','Продаж пока нет.<br>Нажмите + для быстрой продажи')}</div>`}
function exps(){const a=db.exp.filter(e=>inP(e.date)).sort((x,y)=>y.date-x.date),by={};a.forEach(e=>by[e.cat]=(by[e.cat]||0)+e.sum);const t=sum(a,e=>e.sum);
 return head('Расходы','Всего '+fmt(t))+seg()+(t?`<div class="card"><h4>По категориям</h4>${Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([c,v])=>`<div style="margin:8px 0"><div style="display:flex;justify-content:space-between"><span>${IC[c]} ${c}</span><b>${fmt(v)}</b></div><div class="pg"><i style="width:${v/t*100}%"></i></div></div>`).join('')}</div>`:'')+

 const side=i=>`<div class="k" onclick="partAdd(${i})" style="border:1.5px solid rgba(124,92,255,.4)"><div style="font-size:32px">${['🧑','🧔'][i]}</div><b style="font-size:17px">${esc(n[i])}</b><small>доля ${sh[i]}%</small>${R('Вложил',fmt(inv[i]))}${R('Забрал',fmt(out[i]))}${R('Прибыль',fmt(pr[i]),pr[i]>=0?'pos':'neg')}<div style="border-top:1px solid var(--ln);margin-top:8px"></div>${R('Причитается',fmt(due[i]),due[i]>=0?'pos':'neg')}<div class="chip" style="margin:12px 0 0;display:block;text-align:center;background:var(--g);color:#fff;padding:8px">＋ Добавить деньги</div></div>`;
 return head('Партнёр','Бизнес на двоих')+`<div class="hero"><small>Общий вложенный капитал</small><b class="big">${fmt(T)}</b><div class="hm"><div><small>Чистая прибыль</small><b>${fmt(net)}</b></div><div><small>Доли</small><b>${sh[0]} / ${sh[1]}</b></div></div></div>
 <div class="card"><h4>⚔️ Кто сколько вложил</h4><div style="display:flex;height:18px;border-radius:9px;overflow:hidden"><i style="width:${pc}%;background:var(--g)"></i><i style="flex:1;background:#2dd4bf"></i></div><div style="display:flex;justify-content:space-between;margin-top:6px"><small>${esc(n[0])} ${pc.toFixed(0)}%</small><small>${esc(n[1])} ${(100-pc).toFixed(0)}%</small></div>
 <p style="margin:10px 0 0">${w>=0?`⚖️ Чтобы вклады стали равными, <b>${esc(n[w])}</b> нужно добавить <b class="wr">${fmt(need[w])}</b>`:T?'⚖️ Вклады выровнены, всё поровну ✅':'Нажмите на карточку ниже и добавьте первый вклад'}</p></div>
 <div class="grid">${side(0)}${side(1)}</div>
 <div class="card"><h4>История записей</h4>${P.log.slice().sort((a,b)=>b.date-a.date).map(x=>li(x.type=='in'?'➕':'💸',esc(n[x.who])+(x.type=='in'?' вложил':' забрал'),new Date(x.date).toLocaleDateString('ru-RU')+(x.note?' · '+esc(x.note):''),`<span class="${x.type=='in'?'pos':'neg'}">${x.type=='in'?'+':'−'}${fmt(x.sum)}</span>`,'',`partDel('${x.id}')`)).join('')||empty('🤝','Записей пока нет.<br>Нажмите на карточку человека выше, чтобы добавить деньги')}</div>
 <div class="rw"><button class="btn" onclick="partSet()">⚙️ Имена и доли</button></div><small style="display:block;margin-top:8px">Прибыль берётся из всех продаж и расходов за всё время. Причитается = вложил + доля прибыли − забрал.</small>`}
function partAdd(i){const n=db.part.n[i];$('#sheet').innerHTML=`<div class="bk" onclick="closeS()"></div><div class="sh"><div class="hd"></div><div class="ico">${['🧑','🧔'][i]}</div><h3>${esc(n)}</h3><small>Сколько денег?</small>
 <div class="money" style="margin-top:8px"><input id="pa" inputmode="decimal" placeholder="0"><span>${db.set.cur}</span></div>
 <div class="qk">${[1000,5000,10000,50000].map(v=>`<div onclick="$('#pa').value=nv('pa')+${v}">+${v/1000}к</div>`).join('')}</div>
 <div class="rw"><button class="btn pri" onclick="partGo(${i},'in')">➕ Вложил</button><button class="btn" onclick="partGo(${i},'out')">💸 Забрал</button></div></div>`;$('#sheet').classList.add('on')}
function partGo(i,t){const v=nv('pa');if(v<=0)return warn('Введите сумму');db.part.log.push({id:uid(),date:Date.now(),who:i,type:t,sum:v,note:''});save();closeS();go();hap('medium');toast(t=='in'?'Вклад записан ✓':'Выплата записана ✓')}
function partDel(id){if(confirm('Удалить запись?')){db.part.log=db.part.log.filter(l=>l.id!=id);save();go()}}
function partForm(id){const x=db.part.log.find(l=>l.id==id)||{};
 form(id?'Запись':'Новая запись',[{k:'who',l:'Кто',o:db.part.n,v:x.who||0},{k:'type',l:'Что сделал',o:['Вложил в бизнес','Забрал из бизнеса'],v:x.type=='out'?1:0},{k:'sum',l:'Сумма',t:'money',v:x.sum},{k:'note',l:'За что (закупка, товар…)',v:x.note}],v=>{
  if(v.sum<=0)return warn('Введите сумму');const o={who:v.who_i,type:v.type_i?'out':'in',sum:v.sum,note:v.note};
  if(id)Object.assign(x,o);else db.part.log.push({id:uid(),date:Date.now(),...o});save();go();toast('Записано ✓')},id?()=>db.part.log=db.part.log.filter(l=>l.id!=id):0)}
function partSet(){form('Партнёры',[{k:'a',l:'Ваше имя',v:db.part.n[0]},{k:'b',l:'Имя партнёра',v:db.part.n[1]},{k:'s',l:'Ваша доля прибыли, %',t:'number',v:db.part.sh}],v=>{db.part.n=[v.a||'Я',v.b||'Друг'];db.part.sh=Math.min(100,Math.max(0,v.s));save();go()})}
function saleMenu(id){const s=db.sales.find(x=>x.id==id);if(s.tradeId)return undoTrade(s.tradeId);if(!confirm(`Отменить продажу «${s.name}» ×${s.qty}? Товар вернётся на склад.`))return;
 const i=db.items.find(x=>x.id==s.itemId);if(i)i.qty+=s.qty;if(s.ex){const n=db.items.find(x=>x.id==s.ex.id);if(n){n.qty-=s.ex.qty;if(s.ex.prev!=null)n.buy=s.ex.prev;if(n.qty<=0&&s.ex.isNew)db.items=db.items.filter(x=>x!=n)}}db.sales=db.sales.filter(x=>x.id!=id);save();go();toast('Продажа отменена')}
function payDebt(id){db.sales.find(x=>x.id==id).paid=true;save();hap('medium');go();toast('Долг закрыт ✓')}
function expForm(id){const e=db.exp.find(x=>x.id==id)||{};form(id?'Расход':'Новый расход',[{k:'cat',l:'Категория',o:ECATS,ic:ECATS.map(c=>IC[c]||'🧾'),v:e.cat},{k:'sum',l:'Сумма',t:'money',v:e.sum},{k:'note',l:'Комментарий',v:e.note}],v=>{
 if(v.sum<=0)return warn('Введите сумму');delete v.cat_i;if(id)Object.assign(e,v);else db.exp.push({id:uid(),date:Date.now(),...v});save();go();toast('Расход записан ✓')},id?()=>db.exp=db.exp.filter(x=>x.id!=id):0)}
function settings(){form('Настройки',[{k:'cur',l:'Валюта',v:db.set.cur},{k:'low',l:'Предупреждать, когда осталось ≤',t:'number',v:db.set.low}],v=>{db.set={cur:v.cur||'₽',low:v.low};save();go()})}
function report(){const s=stats(),t=`📊 Отчёт (${PN[per]})\nВыручка: ${fmt(s.rev)}\nСебестоимость: ${fmt(s.cogs)}\nРасходы: ${fmt(s.ex)}\nЧистая прибыль: ${fmt(s.net)}\nПродано: ${s.cnt} шт.\nМаржа: ${s.mar.toFixed(0)}%\nСклад: ${fmt(stockVal())}`;
 try{tg.sendData(t)}catch(e){navigator.clipboard?.writeText(t);warn('Отчёт скопирован. Чтобы отправлять в чат, откройте приложение кнопкой из /start.')}}
function dl(name,txt,type){navigator.clipboard?.writeText(txt).catch(()=>{});const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));a.download=name;a.click();toast('Файл готов, копия в буфере')}
function exportCSV(){const r=[['Дата','Товар','Кол-во','Цена','Закупка','Прибыль','Клиент','Оплата']].concat(db.sales.map(s=>[new Date(s.date).toLocaleDateString('ru-RU'),s.name,s.qty,s.price,s.buy,(s.price-s.buy)*s.qty,s.client,s.pay]));
 dl('sales.csv',r.map(x=>x.map(c=>`"${String(c??'').replace(/"/g,'""')}"`).join(';')).join('\n'),'text/csv')}
const exportJSON=()=>dl('backup.json',JSON.stringify(db),'application/json');
function importForm(){form('Импорт бэкапа',[{k:'j',l:'Вставьте JSON из бэкапа',t:'area'}],v=>{try{const d=JSON.parse(v.j);if(!d.items)throw 0;db=d;save();go();toast('Импортировано ✓')}catch(e){return warn('Неверный формат')}})}
function wipe(){if(confirm('Удалить ВСЕ данные?')&&confirm('Точно? Это нельзя отменить.')){db={items:[],sales:[],exp:[],set:{cur:'₽',low:2}};save();go()}}
go();
</script></body></html>
